<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#1B2233"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- grade sutil -->
  <g opacity="0.06" stroke="#FFFFFF">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M0 600h1280M0 720h1280"/>
    <path d="M160 0v800M320 0v800M480 0v800M640 0v800M800 0v800M960 0v800M1120 0v800"/>
  </g>

  <!-- título sutil -->
  <text x="50%" y="92%" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="38" fill="rgba(255,255,255,0.72)">Homelab na Nuvem</text>
  <text x="50%" y="96%" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" fill="rgba(255,255,255,0.58)">Badges dos serviços</text>

  <!-- mosaico de badges -->
  <g transform="translate(0,20)" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#fff" text-anchor="middle">
    <!-- linha 1 -->
    <g transform="translate(320,170)" filter="url(#softShadow)">
      <circle r="80" fill="#2496ED"/>
      <text y="12" font-size="64">D</text>
      <text y="46" font-size="14" fill="rgba(255,255,255,0.9)">Docker</text>
    </g>
    <g transform="translate(640,170)" filter="url(#softShadow)">
      <circle r="80" fill="#00AEEF"/>
      <text y="12" font-size="64">P</text>
      <text y="46" font-size="14" fill="rgba(255,255,255,0.9)">Portainer</text>
    </g>
    <g transform="translate(960,170)" filter="url(#softShadow)">
      <circle r="80" fill="#5A4FCF"/>
      <text y="12" font-size="64">J</text>
      <text y="46" font-size="14" fill="rgba(255,255,255,0.9)">Jellyfin</text>
    </g>

    <!-- linha 2 -->
    <g transform="translate(320,430)" filter="url(#softShadow)">
      <circle r="80" fill="#F46800"/>
      <text y="12" font-size="64">G</text>
      <text y="46" font-size="14" fill="rgba(255,255,255,0.9)">Grafana</text>
    </g>
    <g transform="translate(640,430)" filter="url(#softShadow)">
      <circle r="80" fill="#0078D4"/>
      <text y="12" font-size="64">A</text>
      <text y="46" font-size="14" fill="rgba(255,255,255,0.9)">Azure</text>
    </g>
    <g transform="translate(960,430)" filter="url(#softShadow)">
      <circle r="80" fill="#F80000"/>
      <text y="12" font-size="64">O</text>
      <text y="46" font-size="14" fill="rgba(255,255,255,0.9)">Oracle</text>
    </g>

    <!-- extra -->
    <g transform="translate(1120,620)" opacity="0.0"><rect width="0" height="0"/></g>
    <g transform="translate(160,620)" filter="url(#softShadow)">
      <circle r="64" fill="#F7DF1E"/>
      <text y="10" font-size="48" fill="#0E1116">L</text>
      <text y="38" font-size="12" fill="rgba(14,17,22,0.9)">Linux</text>
    </g>
  </g>
</svg>
