<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#1B2233"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#A6ACB8" />
    </marker>
    <style>
      .t { font-family: 'JetBrains Mono', monospace; fill: #D8DEE9; }
      .h { fill: #C792EA; font-weight: 700; }
      .node { fill: #273247; stroke: rgba(255,255,255,0.08); stroke-width: 1; rx: 14; ry: 14; }
      .pipe { stroke: #A6ACB8; stroke-width: 2.4; opacity: 0.85; }
      .badge { font-weight: 700; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- título -->
  <text x="60" y="80" class="t h" font-size="42">Homelab na Nuvem — Topologia</text>
  <text x="60" y="112" class="t" font-size="18" fill="rgba(216,222,233,0.78)">Visão simplificada da arquitetura: Clouds ➜ VM ➜ Docker ➜ Serviços</text>

  <!-- nós principais -->
  <!-- clouds -->
  <rect x="160" y="180" width="360" height="110" class="node" filter="url(#card)"/>
  <text x="190" y="220" class="t badge" font-size="24">Azure</text>
  <text x="190" y="250" class="t" font-size="16" fill="rgba(216,222,233,0.8)">VM gratuita | Região variável</text>

  <rect x="160" y="330" width="360" height="110" class="node" filter="url(#card)"/>
  <text x="190" y="370" class="t badge" font-size="24">Oracle Cloud</text>
  <text x="190" y="400" class="t" font-size="16" fill="rgba(216,222,233,0.8)">VM Arm/AMD | Créditos free tier</text>

  <!-- VM -->
  <rect x="620" y="250" width="360" height="120" class="node" filter="url(#card)"/>
  <text x="650" y="290" class="t badge" font-size="24">VM Linux</text>
  <text x="650" y="320" class="t" font-size="16" fill="rgba(216,222,233,0.8)">Docker Engine • Portas expostas</text>

  <!-- Docker -->
  <rect x="620" y="430" width="360" height="120" class="node" filter="url(#card)"/>
  <text x="650" y="470" class="t badge" font-size="24">Docker</text>
  <text x="650" y="500" class="t" font-size="16" fill="rgba(216,222,233,0.8)">Compose • Volumes • Redes</text>

  <!-- serviços -->
  <rect x="1060" y="230" width="340" height="110" class="node" filter="url(#card)"/>
  <text x="1090" y="270" class="t badge" font-size="22">Portainer</text>
  <text x="1090" y="300" class="t" font-size="16" fill="rgba(216,222,233,0.8)">Gerencia containers</text>

  <rect x="1060" y="380" width="340" height="110" class="node" filter="url(#card)"/>
  <text x="1090" y="420" class="t badge" font-size="22">Jellyfin</text>
  <text x="1090" y="450" class="t" font-size="16" fill="rgba(216,222,233,0.8)">Mídia pessoal</text>

  <rect x="1060" y="530" width="340" height="110" class="node" filter="url(#card)"/>
  <text x="1090" y="570" class="t badge" font-size="22">Grafana</text>
  <text x="1090" y="600" class="t" font-size="16" fill="rgba(216,222,233,0.8)">Monitoramento</text>

  <!-- conexões -->
  <path d="M520 235 C560 235, 600 260, 620 290" class="pipe" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 385 C560 385, 600 360, 620 330" class="pipe" fill="none" marker-end="url(#arrow)"/>

  <path d="M800 370 C800 390, 800 410, 800 430" class="pipe" fill="none" marker-end="url(#arrow)"/>

  <path d="M980 490 C1020 490, 1040 480, 1060 480" class="pipe" fill="none" marker-end="url(#arrow)"/>
  <path d="M980 490 C1020 460, 1040 440, 1060 440" class="pipe" fill="none" marker-end="url(#arrow)"/>
  <path d="M980 490 C1020 520, 1040 550, 1060 570" class="pipe" fill="none" marker-end="url(#arrow)"/>

  <!-- legenda -->
  <g transform="translate(60,820)">
    <rect x="0" y="-36" width="760" height="44" rx="10" ry="10" fill="rgba(216,222,233,0.08)" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="-8" class="t" font-size="16">Fluxo:</text>
    <text x="90" y="-8" class="t" font-size="16" fill="#9ec4ff">Clouds</text>
    <text x="175" y="-8" class="t" font-size="16">→</text>
    <text x="205" y="-8" class="t" font-size="16" fill="#9ec4ff">VM</text>
    <text x="250" y="-8" class="t" font-size="16">→</text>
    <text x="280" y="-8" class="t" font-size="16" fill="#9ec4ff">Docker</text>
    <text x="355" y="-8" class="t" font-size="16">→</text>
    <text x="385" y="-8" class="t" font-size="16" fill="#9ec4ff">Serviços</text>
  </g>
</svg>
